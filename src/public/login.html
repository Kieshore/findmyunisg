<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | FindMyUniSG</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">FindMyUniSG</div>
      <h1 class="auth-title">Welcome back.</h1>
      <p class="muted">Log in to continue finding courses that fit you.</p>




      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" class="input" type="password" autocomplete="current-password" required />
        </div>
      <div class="auth-divider"><span>or</span></div>
      <div class="oauth-actions">
        <a class="oauth-btn" href="/auth/google">
          <img src="/img/google.svg" alt="" class="oauth-icon" />
          <span>Continue with Google</span>
        </a>

        <a class="oauth-btn" href="/auth/microsoft">
          <img src="/img/outlook.svg" alt="" class="oauth-icon" />
          <span>Continue with Outlook</span>
        </a>
      </div>


        <button class="primary-btn full-btn" type="submit">
          Login
        </button>

        <p id="authError" class="error-message"></p>
      </form>

      <p class="auth-switch">
        New here?
        <a href="/register.html">Create an account</a>
      </p>
    </section>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
