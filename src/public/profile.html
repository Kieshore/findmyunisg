<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | FindMyUniSG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shepherd.js@11.2.0/dist/css/shepherd.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="app-shell">
    <nav class="navbar">
      <a class="brand" href="/course-finder.html"><img class="brand-logo" src="/img/findmyunisg-logo.png" alt="FindMyUniSG" /></a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">&#9776;</button>

      <div class="nav-links">
        <a class="nav-link" href="/course-finder.html">Course Finder</a>
        <a class="nav-link" href="/compare.html">Compare</a>
        <a class="nav-link" href="/saved.html">Saved</a>
        <a class="nav-link active" href="/profile.html">Profile</a>
        <button class="nav-link nav-button" type="button" onclick="logout()">Logout</button>
      </div>
    </nav>

    <section class="page active">
      <h1 class="hero-title">Profile</h1>

      <div class="grid two">
        <section id="profileDetailsCard" class="card">
          <div class="section-header">
            <div>
              <h2>Personal & academic details</h2>
              <p class="muted">
                Your academic profile is used to personalise course recommendations.
              </p>
            </div>

          </div>

          <div class="form-grid">
            <div class="field">
              <label for="firstName">First name</label>
              <input id="firstName" class="input" type="text" readonly/>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input id="email" class="input" type="email" readonly />
            </div>

            <div class="field">
              <label for="postal_code">Postal code</label>
              <input id="postal_code" class="input" type="text"/>
            </div>

            <div class="field">
              <label for="qualification">Qualification</label>
              <select id="qualification" class="select">
                <option value="">Select qualification</option>
                <option value="Diploma">Diploma</option>
                <option value="A Level">A Level</option>
              </select>
            </div>

            <div class="field">
              <label for="school">School</label>
              <input
                id="school"
                class="input"
                type="text"
                placeholder="e.g. Singapore Polytechnic"
              />
            </div>

            <div class="field">
              <label for="course">Course</label>
              <input
                id="course"
                class="input"
                type="text"
                placeholder="e.g. Diploma in Information Technology"
              />
            </div>

            <div class="field">
              <label for="gradYear">Graduation year</label>
              <input
                id="gradYear"
                class="input"
                type="number"
                min="2000"
                max="2040"
                placeholder="e.g. 2026"
              />
            </div>

            <div class="field">
              <label id="scoreLabel" for="academicScore">GPA/RP</label>
              <input
                id="academicScore"
                class="input"
                type="number"
                step="0.01"
                placeholder="Select qualification first"
              />
            </div>
          </div>

          <p id="academicProfileMessage" class="profile-message"></p>

          <div class="profile-action-row">
            <button id="deleteAccountBtn" class="remove-course-btn delete-account-btn" type="button">
              Delete account
            </button>
            <button id="saveAcademicProfileBtn" class="primary-btn hidden" type="button">
              Save changes
            </button>
          </div>
        </section>

        <section id="interestTierCard" class="card">
          <h2>Interests tier list</h2>

          <div class="tier-columns">
            <div>
              <h3>Favoured interests</h3>

              <div class="tier-list" data-kind="wanted">
                <div class="tier-row" data-tier="high">
                  <div class="tier-label">High</div>
                  <div class="tier-dropzone"></div>
                  <button class="plus-btn-tier" type="button">+</button>
                </div>

                <div class="tier-row" data-tier="medium">
                  <div class="tier-label">Med</div>
                  <div class="tier-dropzone"></div>
                  <button class="plus-btn-tier" type="button">+</button>
                </div>

                <div class="tier-row" data-tier="low">
                  <div class="tier-label">Low</div>
                  <div class="tier-dropzone"></div>
                  <button class="plus-btn-tier" type="button">+</button>
                </div>
              </div>
            </div>

            <div>
              <h3>Unfavoured interests</h3>

              <div class="tier-list" data-kind="unwanted">
                <div class="tier-row" data-tier="high">
                  <div class="tier-label">High</div>
                  <div class="tier-dropzone"></div>
                  <button class="plus-btn-tier" type="button">+</button>
                </div>

                <div class="tier-row" data-tier="medium">
                  <div class="tier-label">Med</div>
                  <div class="tier-dropzone"></div>
                  <button class="plus-btn-tier" type="button">+</button>
                </div>

                <div class="tier-row" data-tier="low">
                  <div class="tier-label">Low</div>
                  <div class="tier-dropzone"></div>
                  <button class="plus-btn-tier" type="button">+</button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="interestModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 style="margin: 0;">Add interest</h2>
          <p id="modalContext" class="muted" style="margin: 5px 0 0;"></p>
        </div>

        <button id="closeModal" class="icon-btn" type="button">Close</button>
      </div>

      <input id="interestSearch" class="input" type="search" placeholder="Search interests..." />
      <div id="interestResults" class="interest-results"></div>
      <div class="modal-actions">
        <span id="interestSelectionCount" class="muted">No interests selected</span>
        <button id="addSelectedInterests" class="primary-btn" type="button" disabled>Add selected</button>
      </div>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shepherd.js@11.2.0/dist/js/shepherd.min.js"></script>
  <script src="/js/tutorial.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
